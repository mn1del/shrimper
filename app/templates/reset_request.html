{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h4 mb-3">Reset your password</h1>
    <p class="text-muted">Enter the email associated with your admin account and we'll send a reset link if it exists.</p>
    <form method="post" novalidate>
      <div class="mb-3">
        <label for="reset-email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="reset-email" name="email" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send reset link</button>
    </form>
    <div class="mt-3 text-center">
      <a href="{{ url_for('main.login') }}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
